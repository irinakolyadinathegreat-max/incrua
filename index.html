<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Debug</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
    #debug {
      position: fixed; top: 0; left: 0; right: 0; max-height: 60vh;
      background: rgba(0,0,0,0.88); color: #0f0; font-family: monospace;
      font-size: 13px; padding: 10px; z-index: 99999;
      overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    #debug .err { color: #f44; }
    #debug .ok { color: #4f4; }
    #debug .info { color: #4af; }
    #start-btn {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 20px 50px; background: #ff4400; color: #fff; border: none;
      border-radius: 8px; font-size: 18px; z-index: 99998;
    }
    #start-btn:disabled { opacity: 0.5; }
    #ar-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="debug">Готов. Нажми кнопку.</div>
  <button id="start-btn">Запустить</button>
  <div id="ar-container"></div>

  <video id="fire-video"
         loop muted playsinline webkit-playsinline preload="auto" crossorigin="anonymous"
         style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
    <source src="./fire-video.webm" type="video/webm">
    <source src="./fire-video.mp4" type="video/mp4; codecs=hvc1">
  </video>

  <script>
    const dbg = document.getElementById('debug');
    function log(msg, cls = '') {
      const time = new Date().toLocaleTimeString();
      dbg.innerHTML += '\n<span class="' + cls + '">[' + time + '] ' + msg + '</span>';
      dbg.scrollTop = dbg.scrollHeight;
    }

    log('Браузер: ' + navigator.userAgent.substring(0, 60), 'info');
    log('Протокол: ' + location.protocol, location.protocol === 'https:' ? 'ok' : 'err');
    log('mediaDevices: ' + (navigator.mediaDevices ? 'есть' : 'НЕТ'), navigator.mediaDevices ? 'ok' : 'err');

    window.addEventListener('error', (e) => {
      log('JS ERROR: ' + e.message + ' @ ' + (e.filename||'?') + ':' + (e.lineno||'?'), 'err');
    });
    window.addEventListener('unhandledrejection', (e) => {
      log('PROMISE ERR: ' + ((e.reason && e.reason.message) || e.reason), 'err');
    });

    const startBtn = document.getElementById('start-btn');
    const arContainer = document.getElementById('ar-container');
    const fireVideo = document.getElementById('fire-video');

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запускаю...';
      log('--- КНОПКА НАЖАТА ---', 'info');

      try {
        log('Запрашиваю камеру (environment)...');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, audio: false
        });
        log('КАМЕРА РАЗРЕШЕНА', 'ok');
        stream.getTracks().forEach(t => t.stop());

        try { await fireVideo.play(); log('Видео огня запущено', 'ok'); }
        catch(e) { log('Видео не запустилось: ' + e.message, 'err'); }

        log('Создаю AR-сцену...');
        arContainer.innerHTML =
          '<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
            '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
            '<a-entity mindar-image-target="targetIndex: 0" id="ar-target">' +
              '<a-plane id="fire-plane" width="1.10" height="1.467" position="0 0 0.01" ' +
                'material="shader: flat; src: #fire-video; transparent: true; side: double; depthWrite: false; alphaTest: 0.01" ' +
                'visible="false"></a-plane>' +
            '</a-entity>' +
          '</a-scene>';

        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener('loaded', () => {
          log('a-scene LOADED', 'ok');
          const target = document.getElementById('ar-target');
          const firePlane = document.getElementById('fire-plane');
          target.addEventListener('targetFound', () => {
            log('🎯 ЦЕЛЬ НАЙДЕНА', 'ok');
            firePlane.setAttribute('visible', 'true');
            if (fireVideo.paused) fireVideo.play();
          });
          target.addEventListener('targetLost', () => {
            log('Цель потеряна');
            firePlane.setAttribute('visible', 'false');
          });
        });

        sceneEl.addEventListener('arReady', () => log('arReady', 'ok'));
        sceneEl.addEventListener('arError', (e) => log('arError: ' + JSON.stringify(e.detail), 'err'));

        setTimeout(() => {
          startBtn.style.display = 'none';
          dbg.style.maxHeight = '30vh';
        }, 3000);

      } catch (err) {
        log('ОШИБКА: ' + err.name + ': ' + err.message, 'err');
        startBtn.disabled = false;
        startBtn.textContent = 'Попробовать снова';
      }
    });
  </script>
</body>
</html>
