<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Коза в Огне</title>

    <!-- MindAR + A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: 'Georgia', serif; }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1a0a00 0%, #000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease;
      }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }

      .flame-icon {
        font-size: 64px;
        animation: flicker 1.2s ease-in-out infinite alternate;
        margin-bottom: 20px;
      }
      @keyframes flicker {
        0%   { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300; transform: scale(1) rotate(-2deg); }
        100% { text-shadow: 0 0 40px #ffaa00, 0 0 80px #ff6600; transform: scale(1.1) rotate(2deg); }
      }

      .loading-title {
        color: #ffcc66;
        font-size: 22px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .loading-sub {
        color: #ff6622;
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 0.8;
        margin-bottom: 30px;
      }

      .progress-bar {
        width: 200px;
        height: 3px;
        background: #330000;
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff3300, #ffaa00);
        animation: load 2.5s ease-in-out forwards;
      }
      @keyframes load { from { width: 0%; } to { width: 100%; } }

      /* UI overlay */
      #ui-overlay {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 24px 20px;
        background: linear-gradient(transparent, rgba(0,0,0,0.7));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 100;
        pointer-events: none;
      }
      .hint-text {
        color: rgba(255,200,100,0.9);
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-align: center;
      }
      .hint-icon {
        font-size: 28px;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: translateY(0); }
        50%       { opacity: 1;   transform: translateY(-6px); }
      }

      /* Top bar */
      #top-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 14px 20px;
        background: linear-gradient(rgba(0,0,0,0.6), transparent);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 100;
      }
      .top-flame { font-size: 20px; }
      .top-title {
        color: #ffcc66;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      a-scene { display: block; }
    </style>
  </head>
  <body>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="flame-icon">🔥</div>
      <div class="loading-title">AR Активация</div>
      <div class="loading-sub">Наведи камеру на фигурку козы</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <!-- Top bar -->
    <div id="top-bar">
      <span class="top-flame">🔥</span>
      <span class="top-title">Коза в Огне</span>
    </div>

    <!-- Bottom hint -->
    <div id="ui-overlay">
      <span class="hint-icon">📷</span>
      <span class="hint-text">Наведи камеру на украшение</span>
    </div>

    <!-- AR Scene -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!--
          ЗАМЕНИТЕ src ниже на реальные пути к вашим файлам:
          - fire-video.mp4  — видео с огнём (прозрачный фон, WebM лучше)
          - fire-overlay.png — картинка огня (если используете PNG)
        -->
        <video
          id="fire-video"
          src="./fire-video.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

      <!-- Image target: когда маркер найден — показываем огонь -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!--
          Видео-плоскость с огнём поверх маркера.
          width/height подберите под пропорции вашего видео.
          position="0 0 0.01" — чуть выше плоскости маркера.
        -->
        <a-video
          src="#fire-video"
          width="1"
          height="1.8"
          position="0 0 0.01"
          rotation="0 0 0"
          material="transparent: true; opacity: 0.92; alphaTest: 0.05; side: double"
          visible="false"
          id="fire-plane"
        ></a-video>

        <!-- Запускаем видео при обнаружении маркера -->
        <a-entity
          id="trigger"
          mindar-image-target="targetIndex: 0"
          events__found="mindar-image-target-found: startFire"
          events__lost="mindar-image-target-lost: stopFire"
        ></a-entity>

      </a-entity>

    </a-scene>

    <script>
      // Скрыть загрузочный экран после 2.8 сек
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        ls.classList.add('hidden');
        setTimeout(() => ls.remove(), 900);
      }, 2800);

      // Запуск/остановка видео при нахождении маркера
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', () => {
        const target = document.querySelector('[mindar-image-target]');
        const firePlane = document.getElementById('fire-plane');
        const video = document.getElementById('fire-video');

        target.addEventListener('targetFound', () => {
          firePlane.setAttribute('visible', 'true');
          video.play().catch(() => {});
        });

        target.addEventListener('targetLost', () => {
          firePlane.setAttribute('visible', 'false');
          video.pause();
        });
      });
    </script>

  </body>
</html>
