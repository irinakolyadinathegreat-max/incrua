<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Коза в Огне</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

      /* Стартовый экран с кнопкой */
      #start-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1a0800 0%, #000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 20px;
        padding: 40px;
      }
      #start-screen.hidden { display: none; }

      .flame-icon {
        font-size: 80px;
        animation: flicker 1.1s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 20px #ff6600);
      }
      @keyframes flicker {
        0%   { transform: scale(1) rotate(-2deg); }
        100% { transform: scale(1.1) rotate(2deg); }
      }
      .start-title {
        color: #ffcc66;
        font-size: 22px;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-align: center;
        font-family: Georgia, serif;
      }
      .start-sub {
        color: #ff9944;
        font-size: 14px;
        text-align: center;
        line-height: 1.6;
        font-family: Georgia, serif;
        opacity: 0.85;
      }
      #start-btn {
        margin-top: 10px;
        padding: 18px 48px;
        background: linear-gradient(135deg, #ff4400, #ff9900);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-family: Georgia, serif;
        cursor: pointer;
        box-shadow: 0 0 30px rgba(255,100,0,0.5);
        -webkit-tap-highlight-color: transparent;
      }
      #start-btn:active { opacity: 0.8; transform: scale(0.97); }

      /* Ошибка камеры */
      #error-screen {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 40px;
        gap: 16px;
      }
      #error-screen p {
        color: #ff6644;
        font-size: 15px;
        text-align: center;
        font-family: Georgia, serif;
        line-height: 1.6;
      }
      #retry-btn {
        padding: 14px 36px;
        background: #ff4400;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        font-family: Georgia, serif;
      }

      /* AR подсказка снизу */
      #ui-overlay {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 30px 20px 44px;
        background: linear-gradient(transparent, rgba(0,0,0,0.6));
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 100;
        pointer-events: none;
        font-family: Georgia, serif;
      }
      #ui-overlay.visible { display: flex; }
      .hint-icon {
        font-size: 28px;
        animation: float 2s ease-in-out infinite;
      }
      @keyframes float {
        0%,100% { transform: translateY(0); opacity: 0.5; }
        50%      { transform: translateY(-7px); opacity: 1; }
      }
      .hint-text {
        color: rgba(255,200,100,0.9);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;
      }

      #top-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 14px 18px;
        background: linear-gradient(rgba(0,0,0,0.5), transparent);
        display: none;
        align-items: center;
        gap: 8px;
        z-index: 100;
        font-family: Georgia, serif;
      }
      #top-bar.visible { display: flex; }
      .top-title { color: #ffcc66; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }

      a-scene { display: block; }
    </style>
  </head>
  <body>

    <!-- Стартовый экран -->
    <div id="start-screen">
      <div class="flame-icon">🔥</div>
      <div class="start-title">Коза в огне</div>
      <div class="start-sub">Нажми кнопку, разреши доступ к камере и наведи на украшение</div>
      <button id="start-btn">Запустить AR</button>
    </div>

    <!-- Экран ошибки -->
    <div id="error-screen">
      <div style="font-size:48px">📷</div>
      <p>Камера недоступна.<br><br>Открой настройки браузера и разреши доступ к камере для этого сайта, затем попробуй снова.</p>
      <button id="retry-btn" onclick="location.reload()">Попробовать снова</button>
    </div>

    <!-- Верхняя панель (показывается после запуска) -->
    <div id="top-bar">
      <span style="font-size:18px">🔥</span>
      <span class="top-title">Коза в огне</span>
    </div>

    <!-- Подсказка снизу -->
    <div id="ui-overlay" class="visible" style="display:none">
      <span class="hint-icon">📷</span>
      <span class="hint-text">Наведи камеру на украшение</span>
    </div>

    <!-- AR сцена — создаётся динамически после разрешения камеры -->
    <div id="ar-container"></div>

    <script>
      const startBtn = document.getElementById('start-btn');
      const startScreen = document.getElementById('start-screen');
      const errorScreen = document.getElementById('error-screen');
      const topBar = document.getElementById('top-bar');
      const uiOverlay = document.getElementById('ui-overlay');
      const arContainer = document.getElementById('ar-container');

      startBtn.addEventListener('click', async () => {
        startBtn.textContent = 'Запуск...';
        startBtn.disabled = true;

        try {
          // Сначала явно запрашиваем разрешение на камеру
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });
          // Разрешение получено — останавливаем тестовый поток, MindAR откроет свой
          stream.getTracks().forEach(t => t.stop());

          // Прячем стартовый экран
          startScreen.classList.add('hidden');
          topBar.classList.add('visible');
          uiOverlay.style.display = 'flex';

          // Вставляем AR сцену
          arContainer.innerHTML = `
            <a-scene
              mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
              color-space="sRGB"
              renderer="colorManagement: true"
              vr-mode-ui="enabled: false"
              device-orientation-permission-ui="enabled: false"
            >
              <a-assets>
                <video
                  id="fire-video"
                  src="./fire-video.mp4"
                  preload="auto"
                  loop
                  muted
                  playsinline
                  webkit-playsinline
                  crossorigin="anonymous"
                ></video>
              </a-assets>

              <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

              <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
                <a-video
                  id="fire-plane"
                  src="#fire-video"
                  width="1"
                  height="1.78"
                  position="0 0 0.01"
                  material="shader: flat; transparent: true; blending: additive; depthWrite: false; side: double"
                  visible="false"
                ></a-video>
              </a-entity>
            </a-scene>
          `;

          // Ждём загрузки сцены и вешаем события
          const checkScene = setInterval(() => {
            const sceneEl = document.querySelector('a-scene');
            if (!sceneEl) return;
            sceneEl.addEventListener('loaded', () => {
              clearInterval(checkScene);
              const target = document.getElementById('ar-target');
              const firePlane = document.getElementById('fire-plane');
              const video = document.getElementById('fire-video');

              target.addEventListener('targetFound', () => {
                firePlane.setAttribute('visible', 'true');
                video.play().catch(() => {});
                uiOverlay.style.display = 'none';
              });

              target.addEventListener('targetLost', () => {
                firePlane.setAttribute('visible', 'false');
                video.pause();
                uiOverlay.style.display = 'flex';
              });
            });
          }, 200);

        } catch (err) {
          // Камера не разрешена
          startScreen.classList.add('hidden');
          errorScreen.style.display = 'flex';
        }
      });
    </script>

  </body>
</html>
