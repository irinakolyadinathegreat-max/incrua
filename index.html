<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AR Коза в Огне</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: 'Georgia', serif; }

      #loading-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1a0800 0%, #000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 1s ease;
      }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }

      .flame-icon {
        font-size: 72px;
        animation: flicker 1.1s ease-in-out infinite alternate;
        margin-bottom: 24px;
        filter: drop-shadow(0 0 20px #ff6600);
      }
      @keyframes flicker {
        0%   { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 20px #ff4400); }
        100% { transform: scale(1.1) rotate(2deg); filter: drop-shadow(0 0 40px #ffaa00); }
      }
      .loading-title {
        color: #ffcc66;
        font-size: 20px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .loading-sub {
        color: #ff7733;
        font-size: 13px;
        letter-spacing: 1.5px;
        opacity: 0.8;
        margin-bottom: 32px;
        text-align: center;
        padding: 0 20px;
      }
      .progress-bar {
        width: 220px;
        height: 2px;
        background: rgba(255,80,0,0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff3300, #ffcc00);
        animation: load 2.5s cubic-bezier(.4,0,.2,1) forwards;
        width: 0;
      }
      @keyframes load { to { width: 100%; } }

      #top-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 16px 20px;
        background: linear-gradient(rgba(0,0,0,0.55), transparent);
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 100;
      }
      .top-flame { font-size: 22px; }
      .top-title {
        color: #ffcc66;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      #ui-overlay {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 30px 20px 40px;
        background: linear-gradient(transparent, rgba(0,0,0,0.65));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 100;
        pointer-events: none;
      }
      .hint-icon {
        font-size: 30px;
        animation: float 2.2s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { opacity: 0.5; transform: translateY(0); }
        50%       { opacity: 1;   transform: translateY(-8px); }
      }
      .hint-text {
        color: rgba(255,200,100,0.85);
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-align: center;
      }
    </style>
  </head>
  <body>

    <div id="loading-screen">
      <div class="flame-icon">🔥</div>
      <div class="loading-title">AR Активация</div>
      <div class="loading-sub">Наведи камеру на украшение и удержи в кадре</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <div id="top-bar">
      <span class="top-flame">🔥</span>
      <span class="top-title">Коза в огне</span>
    </div>

    <div id="ui-overlay">
      <span class="hint-icon">📷</span>
      <span class="hint-text">Наведи камеру на украшение</span>
    </div>

    <!--
      blending="additive" — ключевая настройка:
      чёрный фон видео становится прозрачным, огонь "светится" поверх реального мира.
    -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="fire-video"
          src="./fire-video.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="ar-target">

        <!--
          width="1" height="1.78" — вертикальное видео 9:16.
          Если твоё видео горизонтальное — поменяй на width="1.78" height="1".
          position="0 0 0.01" — располагаем чуть перед маркером.
        -->
        <a-video
          id="fire-plane"
          src="#fire-video"
          width="1"
          height="1.78"
          position="0 0 0.01"
          material="shader: flat; transparent: true; blending: additive; depthWrite: false; side: double"
          visible="false"
        ></a-video>

      </a-entity>
    </a-scene>

    <script>
      // Убираем загрузочный экран
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        ls.classList.add('hidden');
        setTimeout(() => ls.remove(), 1000);
      }, 2800);

      const sceneEl  = document.querySelector('a-scene');
      const firePlane = document.getElementById('fire-plane');
      const video    = document.getElementById('fire-video');
      const target   = document.getElementById('ar-target');
      const hint     = document.getElementById('ui-overlay');

      sceneEl.addEventListener('loaded', () => {

        target.addEventListener('targetFound', () => {
          firePlane.setAttribute('visible', 'true');
          const p = video.play();
          if (p) p.catch(() => {
            // iOS требует жеста — ловим первый тап
            document.addEventListener('click', () => video.play(), { once: true });
          });
          hint.style.opacity = '0';
        });

        target.addEventListener('targetLost', () => {
          firePlane.setAttribute('visible', 'false');
          video.pause();
          hint.style.opacity = '1';
        });

      });
    </script>

  </body>
</html>
